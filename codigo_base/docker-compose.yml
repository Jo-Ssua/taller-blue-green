version: '3.8'

services:
  nginx-router:
    image: nginx:1.25-alpine
    container_name: nginx-router
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app-blue
      - app-green
    networks:
      - deploy-net

  app-blue:
    build: ./app-blue
    container_name: app-blue
    ports:
      - "8081:8080"
    environment:
      - APP_COLOR=#1E40AF
      - APP_ENV=BLUE
      - APP_VERSION=1.0.0
    networks:
      - deploy-net

  app-green:
    build: ./app-green
    container_name: app-green
    ports:
      - "8082:8080"
    environment:
      - APP_COLOR=#15803D
      - APP_ENV=GREEN
      - APP_VERSION=2.0.0
    networks:
      - deploy-net

networks:
  deploy-net:
    driver: bridge
